name: OCI A1 Always Free capacity claim (private scheduler)

# Place this file ONLY in the private carlers/mosaic-oci-a1-scheduler repo.
# Pinned to accepted Mosaic controller commit. Never put OCI secrets in this file.
# Scheduled work requires MOSAIC_OCI_WATCH_ENABLED=true; manual observe-only remains available.
on:
  schedule:
    # Sustainable default for GitHub Free private-repository minutes.
    - cron: '17,47 * * * *'
    # Extra checks make total cadence five minutes; disabled by default.
    # Skipping these jobs avoids runner-minute charges when fast mode is off.
    - cron: '2,7,12,22,27,32,37,42,52,57 * * * *'
  workflow_dispatch:
    inputs:
      audit_launch_prereqs:
        description: 'Read-only check of image, subnet, inventory and SSH key (never launch)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mosaic-a1-single-claim
  cancel-in-progress: false

jobs:
  report-or-claim:
    if: ${{ github.repository == 'carlers/mosaic-oci-a1-scheduler' && github.event.repository.private == true && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.MOSAIC_OCI_WATCH_ENABLED == 'true') && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17,47 * * * *' || vars.MOSAIC_OCI_FAST_POLL == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MOSAIC_CONTROLLER_SHA: 7ce292b819c85bc87380c24a1a7b54c96ed31cab
      MOSAIC_OCI_AUTOLAUNCH: ${{ vars.MOSAIC_OCI_AUTOLAUNCH || 'false' }}
      MOSAIC_OCI_COMPARTMENT_OCID: ${{ secrets.MOSAIC_OCI_COMPARTMENT_OCID }}
      MOSAIC_OCI_SUBNET_OCID: ${{ secrets.MOSAIC_OCI_SUBNET_OCID }}
      MOSAIC_OCI_IMAGE_OCID: ${{ secrets.MOSAIC_OCI_IMAGE_OCID }}
      MOSAIC_OCI_FREE_TIER_CONFIRMED: ${{ vars.MOSAIC_OCI_FREE_TIER_CONFIRMED || 'NO' }}
      MOSAIC_OCI_QUOTA_CONFIRMED: ${{ vars.MOSAIC_OCI_QUOTA_CONFIRMED || 'NO' }}
    steps:
      - name: Check out reviewed Mosaic controller (immutable SHA)
        uses: actions/checkout@v4
        with:
          repository: carlers/mosaic-life-tracker
          ref: ${{ env.MOSAIC_CONTROLLER_SHA }}
          path: mosaic-source
          persist-credentials: false

      - name: Verify the exact pinned controller commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MOSAIC_CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ "$(git -C mosaic-source rev-parse HEAD)" != "$MOSAIC_CONTROLLER_SHA" ]]; then
            echo 'Controller SHA is missing or not the checked out revision.'
            exit 1
          fi

      - name: Install OCI CLI in a temporary isolated virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/oci-venv"
          "$RUNNER_TEMP/oci-venv/bin/pip" --disable-pip-version-check install --quiet oci-cli==3.95.0
          echo "$RUNNER_TEMP/oci-venv/bin" >> "$GITHUB_PATH"

      - name: Configure ephemeral OCI API signing key, without logging identifiers
        shell: bash
        env:
          OCI_TENANCY: ${{ secrets.MOSAIC_OCI_TENANCY_OCID }}
          OCI_USER: ${{ secrets.MOSAIC_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.MOSAIC_OCI_FINGERPRINT }}
          OCI_SIGNING_KEY: ${{ secrets.MOSAIC_OCI_API_KEY_PEM }}
          OCI_SSH_PUBLIC: ${{ secrets.MOSAIC_OCI_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for key in OCI_TENANCY OCI_USER OCI_FINGERPRINT OCI_SIGNING_KEY OCI_SSH_PUBLIC; do
            if [[ -z "${!key:-}" ]]; then
              echo 'Missing required secret; no API calls were attempted.'
              exit 1
            fi
          done
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_SIGNING_KEY" > "$HOME/.oci/oci_signing.pem"
          printf '%s\n' "$OCI_SSH_PUBLIC" > "$RUNNER_TEMP/a1-ssh.pub"
          {
            printf '[DEFAULT]\n'
            printf 'user=%s\n' "$OCI_USER"
            printf 'tenancy=%s\n' "$OCI_TENANCY"
            printf 'fingerprint=%s\n' "$OCI_FINGERPRINT"
            printf 'key_file=%s\n' "$HOME/.oci/oci_signing.pem"
            printf 'region=ap-singapore-1\n'
          } > "$HOME/.oci/config"
          echo "MOSAIC_OCI_SSH_PUBLIC_KEY_FILE=$RUNNER_TEMP/a1-ssh.pub" >> "$GITHUB_ENV"

      - name: Audit launch prerequisites (read-only manual dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_launch_prereqs == true }}
        shell: bash
        run: |
          node <<'NODE'
          const {spawnSync} = require('node:child_process');
          const {readFileSync} = require('node:fs');
          const e = process.env;
          function query(parts, label) {
            const result = spawnSync('oci', [...parts, '--region', 'ap-singapore-1', '--no-retry', '--output', 'json'], {
              encoding: 'utf8', timeout: 90000, maxBuffer: 4 * 1024 * 1024,
              stdio: ['ignore', 'pipe', 'pipe'], shell: false,
            });
            if (result.error || result.status !== 0) {
              throw new Error(label + ': denied or unavailable; inspect dedicated OCI bot IAM');
            }
            try { return JSON.parse(result.stdout); }
            catch { throw new Error(label + ': invalid OCI JSON'); }
          }
          try {
            const inventory = query(['compute', 'instance', 'list',
              '--compartment-id', e.MOSAIC_OCI_COMPARTMENT_OCID, '--all'], 'A1 inventory');
            if (!Array.isArray(inventory.data)) throw new Error('A1 inventory: missing list');
            const existing = inventory.data.some(x => x.shape === 'VM.Standard.A1.Flex');
            const image = query(['compute', 'image', 'get',
              '--image-id', e.MOSAIC_OCI_IMAGE_OCID], 'Ubuntu image');
            const compatible = query(['compute', 'image-shape-compatibility-entry', 'list',
              '--image-id', e.MOSAIC_OCI_IMAGE_OCID, '--all'], 'A1 image compatibility');
            const subnet = query(['network', 'subnet', 'get',
              '--subnet-id', e.MOSAIC_OCI_SUBNET_OCID], 'VCN subnet');
            const i = image.data ?? {};
            if (!/ubuntu/i.test(String(i['operating-system'])) ||
                !String(i['operating-system-version']).startsWith('24.04') ||
                i['lifecycle-state'] !== 'AVAILABLE' ||
                !Array.isArray(compatible.data) ||
                !compatible.data.some(x => x.shape === 'VM.Standard.A1.Flex')) {
              throw new Error('Selected image is not an AVAILABLE Ubuntu 24.04 A1-compatible image');
            }
            if (subnet.data?.id !== e.MOSAIC_OCI_SUBNET_OCID ||
                subnet.data?.['lifecycle-state'] !== 'AVAILABLE') {
              throw new Error('Selected subnet is not AVAILABLE');
            }
            const pub = readFileSync(e.MOSAIC_OCI_SSH_PUBLIC_KEY_FILE, 'utf8').trim();
            if (!/^(ssh-ed25519|ssh-rsa) [A-Za-z0-9+/]+={0,3}(?: [^\r\n]*)?$/.test(pub) ||
                pub.length > 2000) {
              throw new Error('SSH public key is invalid');
            }
            console.log('READ-ONLY PREFLIGHT PASSED: instance inventory, Ubuntu A1 image, subnet and SSH public key');
            console.log('Existing A1 instance in dedicated compartment: ' + (existing ? 'YES (do not launch another)' : 'NO'));
            console.log('Not tested: LaunchInstance permission, quota enforcement, public cost classification or billing');
          } catch (error) {
            console.error('READ-ONLY PREFLIGHT FAILED: ' + error.message);
            process.exitCode = 1;
          }
          NODE

      - name: Check capacity and optionally claim ONE A1 instance
        shell: bash
        run: |
          set -euo pipefail
          node mosaic-source/life-tracker/scripts/oci-a1-autoclaim.mjs > "$RUNNER_TEMP/a1-result.json"
          cat "$RUNNER_TEMP/a1-result.json"
          cat "$RUNNER_TEMP/a1-result.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Explain result and safety boundaries
        if: always()
        shell: bash
        run: |
          {
            echo ''
            echo 'Observes Singapore VM.Standard.A1.Flex 2 OCPU / 12 GB every 30 minutes (or 5 minutes with MOSAIC_OCI_FAST_POLL=true).'
            echo 'Launch remains off until explicitly enabled and quota/free-tier confirmations provided.'
            echo 'On success creates a VM with 50 GB boot storage and NO public IP.'
            echo 'Never installs Appwrite, opens ports or changes Mosaic Production.'
            echo 'Capacity reports and GitHub cron are best-effort, not guarantees.'
            echo 'Check OCI Console and billing alerts after any launch.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key and report
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.oci/config" "$HOME/.oci/oci_signing.pem" \
            "$RUNNER_TEMP/a1-ssh.pub" "$RUNNER_TEMP/a1-result.json"
